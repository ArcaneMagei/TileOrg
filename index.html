<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tile Wall Simulator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <aside class="controls-panel">
      <header class="controls-header">
        <h1>Tile Wall Designer</h1>
        <p>Stack-bond square tiles with configurable arrangements, textures, grout, and overlay objects.</p>
      </header>

      <fieldset>
        <legend>Wall</legend>
        <div class="control-grid two-col">
          <label class="control-row"><span>Columns</span><input id="columns" type="number" min="1" value="3" /></label>
          <label class="control-row"><span>Rows</span><input id="rows" type="number" min="1" value="13" /></label>
          <label class="control-row"><span>Tile Width (cm)</span><input id="tileWidthCm" type="number" min="1" value="20" /></label>
          <label class="control-row"><span>Tile Height (cm)</span><input id="tileHeightCm" type="number" min="1" value="20" /></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Viewer</legend>
        <label class="control-row"><span>Scale</span>
          <div class="inline-range">
            <input id="viewerScale" type="range" min="50" max="175" value="100" />
            <strong id="viewerScaleValue">100%</strong>
          </div>
        </label>
      </fieldset>

      <fieldset>
        <legend>Grout</legend>
        <label class="control-row"><span>Color</span><input id="groutColor" type="color" value="#d5d5d5" /></label>
        <label class="control-row"><span>Size</span>
          <div class="inline-range">
            <input id="groutSize" type="range" min="0" max="16" value="3" />
            <strong id="groutSizeValue">3px</strong>
          </div>
        </label>
      </fieldset>

      <fieldset>
        <legend>Arrangement (Stack Bond)</legend>
        <label class="control-row"><span>Arrangement</span>
          <select id="patternType">
            <option value="aligned">Aligned</option>
            <option value="checker">Checker Mix</option>
            <option value="diagonal">Diagonal Flow</option>
            <option value="pinwheel">Pinwheel Rotation</option>
            <option value="random">Random by Inventory (±10)</option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend>Tile Types / Packs</legend>
        <div id="tileTypes" class="tile-types"></div>
      </fieldset>

      <fieldset>
        <legend>Overlay Objects</legend>
        <div class="overlay-row">
          <label class="control-row compact"><span>Shape</span>
            <select id="overlayShape">
              <option value="rectangle">Rectangle</option>
              <option value="ellipse">Ellipse</option>
            </select>
          </label>
          <button id="addOverlay" type="button">Add Object</button>
        </div>
        <p class="hint">Objects can be dragged and resized with the corner handle.</p>
      </fieldset>
    </aside>

    <section class="viewer-panel">
      <div id="wall" aria-label="Tile wall preview"></div>
    </section>
  </main>

  <template id="tileTypeTemplate">
    <article class="tile-type-row">
      <div class="tile-top-row">
        <label class="control-row compact"><span>Name</span><input class="tile-name" type="text" /></label>
        <label class="control-row compact"><span>Color</span><input class="tile-color" type="color" /></label>
      </div>
      <div class="tile-top-row">
        <label class="control-row compact"><span>Pack Count</span><input class="tile-pack" type="number" min="0" value="1" /></label>
        <label class="control-row compact"><span>Tiles / Pack</span><input class="tiles-per-pack" type="number" min="1" value="10" /></label>
      </div>
      <div class="tile-image-controls">
        <div class="tile-thumb" aria-hidden="true"></div>
        <label class="control-row compact"><span>Image URL</span><input class="tile-image-url" type="url" placeholder="https://..." /></label>
        <label class="control-row compact"><span>Upload</span><input class="tile-image-file" type="file" accept="image/*" /></label>
        <button class="clear-image" type="button">Clear Image</button>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
