<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tile Wall Simulator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <aside class="controls-panel">
      <header class="controls-header"><h1>Tile Wall Designer</h1></header>

      <fieldset>
        <legend>Wall</legend>
        <div class="control-grid two-col">
          <label class="control-row"><span>Columns</span><input id="columns" type="number" min="1" value="3" /></label>
          <label class="control-row"><span>Rows</span><input id="rows" type="number" min="1" value="13" /></label>
          <label class="control-row"><span>Tile Width (cm)</span><input id="tileWidthCm" type="number" min="1" value="20" /></label>
          <label class="control-row"><span>Tile Height (cm)</span><input id="tileHeightCm" type="number" min="1" value="20" /></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Viewer</legend>
        <label class="control-row"><span>Scale</span>
          <div class="inline-range">
            <input id="viewerScale" type="range" min="20" max="260" step="1" value="100" />
            <strong id="viewerScaleValue">100%</strong>
          </div>
        </label>
      </fieldset>

      <fieldset>
        <legend>Grout</legend>
        <label class="control-row"><span>Color</span><input id="groutColor" type="color" value="#d5d5d5" /></label>
        <label class="control-row"><span>Size (mm)</span>
          <div class="inline-range">
            <input id="groutSizeMm" type="range" min="0.5" max="5" step="0.1" value="1.5" />
            <strong id="groutSizeValue">1.5 mm</strong>
          </div>
        </label>
      </fieldset>

      <fieldset>
        <legend>Pattern (9 models)</legend>
        <label class="control-row"><span>Arrangement</span>
          <select id="patternType">
            <option value="latinShift">Latin Shift</option>
            <option value="diamondWave">Diamond Wave</option>
            <option value="checker9">9-Color Checker</option>
            <option value="antiNeighborRandom">Random No-Adjacency</option>
            <option value="antiNeighborBands">No-Adjacency Bands</option>
            <option value="antiNeighborSpiral">No-Adjacency Spiral Seed</option>
            <option value="antiNeighborDiagonal">No-Adjacency Diagonal Sweep</option>
            <option value="antiNeighborBlocks">No-Adjacency Block Shuffle</option>
            <option value="inventoryBlend">Inventory Blend (±10)</option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend>Tile Models</legend>
        <div id="tileTypes" class="tile-types"></div>
      </fieldset>

      <fieldset>
        <legend>Overlay Objects</legend>
        <div class="overlay-row">
          <label class="control-row compact"><span>Shape</span>
            <select id="overlayShape">
              <option value="rectangle">Rectangle</option>
              <option value="ellipse">Ellipse</option>
            </select>
          </label>
          <label class="control-row compact"><span>Color</span><input id="overlayColor" type="color" value="#2d4fd8" /></label>
          <label class="control-row compact"><span>Opacity</span><input id="overlayOpacity" type="range" min="0.1" max="1" step="0.05" value="0.9" /></label>
          <button id="addOverlay" type="button">Add Object</button>
        </div>
      </fieldset>
    </aside>

    <section class="viewer-panel">
      <div class="viewer-stage"><div id="wall" aria-label="Tile wall preview"></div></div>
    </section>
  </main>

  <template id="tileTypeTemplate">
    <article class="tile-type-row">
      <div class="tile-card-header">
        <span class="tile-model-id"></span>
        <div class="tile-thumb" aria-hidden="true"></div>
      </div>
      <div class="tile-row-grid">
        <label class="control-row compact"><span>Name</span><input class="tile-name" type="text" /></label>
        <label class="control-row compact"><span>Color</span><input class="tile-color" type="color" /></label>
        <label class="control-row compact"><span>Packs</span><input class="tile-pack" type="number" min="0" value="1" /></label>
        <label class="control-row compact"><span>Tiles/Pack</span><input class="tiles-per-pack" type="number" min="1" value="10" /></label>
      </div>
      <div class="tile-image-actions">
        <label class="upload-image-btn" role="button" tabindex="0">Upload Texture<input class="tile-image-file" type="file" accept="image/*" /></label>
        <button class="clear-image" type="button">Clear</button>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
